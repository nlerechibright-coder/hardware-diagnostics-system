<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | H.D.S.</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900">
    <div class="min-h-screen flex items-center justify-center px-4 py-10">
      <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
          <div class="px-6 py-8 bg-slate-900 text-white">
            <p class="text-xs uppercase tracking-[0.25em] text-slate-300">Hardware Diagnostic System</p>
            <h1 class="mt-3 text-3xl font-bold">Welcome back</h1>
          </div>

          <div class="p-6 sm:p-8">
            {% if form.errors %}
              <div class="mb-5 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
                Your username and password didn’t match. Please try again.
              </div>
            {% endif %}

            <form method="post" class="space-y-5">
              {% csrf_token %}
              <div>
                <label for="id_username" class="mb-2 block text-sm font-medium text-slate-700">Username</label>
                <input id="id_username" name="username" type="text" autocomplete="username" required class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-2.5 text-slate-900 shadow-sm outline-none transition focus:border-sky-500 focus:bg-white focus:ring-2 focus:ring-sky-100" />
              </div>

              <div>
                <label for="id_password" class="mb-2 block text-sm font-medium text-slate-700">Password</label>
                <input id="id_password" name="password" type="password" autocomplete="current-password" required class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-2.5 text-slate-900 shadow-sm outline-none transition focus:border-sky-500 focus:bg-white focus:ring-2 focus:ring-sky-100" />
              </div>

              <button type="submit" class="w-full rounded-xl bg-sky-600 px-4 py-3 text-sm font-semibold text-white shadow-md transition hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-200">
                Sign in
              </button>
            </form>

            <div class="mt-6 text-center text-sm text-slate-600">
              Need an account?
              <a href="{% url 'signup' %}" class="font-semibold text-sky-700 hover:text-sky-800">Create one</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
